# M.A.D. (Mutual Assured Destruction): a Cold War strategy simulation.
# Needs Python 3 (standard library only).  Fine on a Commodore 64: the
# gateway turns the ANSI colours into PETSCII.
#
# Optional settings go in settings.conf in this folder (an update never
# replaces it):  baud = 600  (0 = full speed),  missiles = 6
name = M.A.D.
description = Mutual Assured Destruction: choose a side, pick targets
version = 1.0
author = Ethernet Gateway examples
min_gateway = 1.1.0
command = mad.py
command_windows = mad.cmd
